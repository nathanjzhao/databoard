name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SERVER_PEPPER: ci-only-pepper-0000000000000000000000000000
      BLIND_TENDER_DEMO: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate schema module
        run: npm run gen:schema

      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # The served-JS hash manifest for this exact commit, one per build.
      # Never committed (hashes are per-build); auditors diff it against the
      # manifest the deployed site serves at /api/transparency/js-manifest.
      - name: Upload served-JS hash manifest
        uses: actions/upload-artifact@v4
        with:
          name: build-manifest-sha256-${{ github.sha }}
          path: .next/build-manifest.sha256.json
          retention-days: 90

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Reset and seed database
        run: npm run reset-db && npm run seed

      - name: Proof suites
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-output
          path: test-results/
          retention-days: 7
